name: Workflow Demo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create a text file
      run: echo "Hello, world!" > hello.txt

    - name: Archive text file
      uses: actions/upload-artifact@v4
      with:
        name: hello-artifact
        path: hello.txt
  download:
     needs: build
     runs-on: ubuntu-latest
     steps: 
      - name: Download dragon text files
        uses: actions/download-artifact@v4
        with:
          name: hello-artifact
          path: ./artifacts
      - name: file permission
        run: chmod 777 ./artifacts/hello.txt
      - name: Read files
        run: cat ./artifacts/hello.txt
